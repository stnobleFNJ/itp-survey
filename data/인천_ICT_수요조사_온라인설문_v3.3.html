<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026년 인천 ICT이노베이션스퀘어 수요조사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213D; --navy-2:#1E2F57; --navy-3:#2B4077;
  --yellow:#FFC72C; --yellow-deep:#E5AC00;
  --paper:#FFFFFF; --mist:#F1F4FA; --line:#C7D0E3;
  --ink:#101A33; --ink-2:#4A5672; --on-navy:#DCE4F5; --on-navy-2:#9FB0D3;
  --warn:#B3261E;
  --r-card:22px; --r-opt:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--navy);color:var(--ink);font-family:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:17px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.card :focus-visible{outline-color:var(--navy-3)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}

/* 머리 */
.top{display:flex;align-items:center;gap:14px;padding:18px 0 14px}
.logo{display:flex;align-items:center}
.logo img{height:38px;width:auto;display:block}
.top-name{color:var(--on-navy);font-size:14px;font-weight:500}

/* 진행도 */
.progress{padding:4px 0 18px}
.track{display:flex;gap:4px;height:10px}
.seg{position:relative;background:var(--navy-3);border-radius:5px;overflow:hidden;min-width:10px}
.seg i{position:absolute;inset:0 auto 0 0;background:var(--yellow);border-radius:5px;transition:width .25s ease}
.seg-names{display:flex;gap:4px;margin-top:6px}
.seg-names span{font-size:12px;color:var(--on-navy-2);min-width:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-names span.on{color:var(--yellow);font-weight:600}
.prog-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:10px;color:var(--on-navy)}
.prog-sec{font-size:14px;font-weight:500}
.prog-count{font-size:14px;white-space:nowrap}
.prog-count b{color:var(--yellow);font-size:20px;font-weight:700}

/* 시작 화면 */
.intro{color:#fff;padding:26px 0 120px;position:relative}
.intro h1{font-size:clamp(30px,6.2vw,46px);line-height:1.22;font-weight:700;margin:0 0 22px;letter-spacing:-.02em}
.intro h1 span{display:block}
.rule{width:84px;height:8px;background:var(--yellow);border-radius:4px;margin:0 0 26px}
.intro p{color:var(--on-navy);margin:0 0 14px;max-width:38em}
.facts{list-style:none;margin:26px 0 30px;padding:0;border-top:1px solid var(--navy-3)}
.facts li{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--navy-3);color:var(--on-navy)}
.facts b{flex:0 0 5.5em;color:var(--yellow);font-weight:600}
.btn-start{background:var(--yellow);color:var(--navy);border:0;border-radius:14px;padding:16px 34px;font-size:19px;font-weight:700}
.btn-start:hover{background:#FFD65C}
.resume{margin-top:14px;font-size:15px;color:var(--on-navy)}
.resume button{background:none;border:0;color:var(--yellow);text-decoration:underline;padding:0;font-weight:600}

/* 문항 카드 */
.sheet{padding-bottom:120px}
.card{background:var(--paper);border-radius:var(--r-card);padding:34px 30px 30px;position:relative;margin-top:22px}
.qno{position:absolute;top:-18px;left:26px;background:var(--yellow);color:var(--navy);font-weight:700;font-size:18px;padding:5px 16px;border-radius:10px}
.card h2{font-size:clamp(21px,4.4vw,26px);line-height:1.38;margin:8px 0 10px;font-weight:700;letter-spacing:-.01em}
.card h2:focus{outline:none}
.pick{display:inline-block;background:var(--mist);color:var(--navy-3);font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;margin:0 0 10px}
.help{color:var(--ink-2);font-size:16px;margin:0 0 6px}
.note{color:var(--ink-2);font-size:15px;margin:14px 0 0;padding-left:1em;text-indent:-1em}
.note::before{content:"※ "}
.opts{display:grid;gap:10px;margin-top:18px}
.opts.cols{grid-template-columns:repeat(2,1fr)}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-opt);padding:13px 15px;line-height:1.45}
.opt:hover{background:var(--mist)}
.opt .mk{flex:0 0 22px;height:22px;border:2px solid var(--line);border-radius:50%;margin-top:1px;display:grid;place-items:center;background:#fff}
.opt.sq .mk{border-radius:6px}
.opt[aria-checked="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.opt[aria-checked="true"] .mk{background:var(--yellow);border-color:var(--yellow)}
.opt[aria-checked="true"] .mk::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--navy);border-bottom:2.5px solid var(--navy);transform:rotate(-45deg) translate(1px,-1px)}
.opt small{display:block;font-size:14px;opacity:.75;margin-top:2px}
.sub-input{margin:-2px 0 4px 0}
.sub-input input{width:100%}
input[type=text],input[type=number],input[type=tel],input[type=email],textarea{border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;width:100%}
input[type=number]{width:8.5em}
textarea{min-height:130px;resize:vertical;line-height:1.55}
.part{margin-top:22px}
.grp{grid-column:1/-1;font-weight:600;color:var(--navy-3);font-size:15px;margin:8px 0 -2px}
.grp:first-child{margin-top:0}
.terms{display:grid;grid-template-columns:8.5em 1fr;gap:0;margin:14px 0 4px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
.terms dt{background:var(--mist);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
.terms dd{margin:0;padding:10px 12px;white-space:pre-line;border-bottom:1px solid var(--line);line-height:1.5}
.terms dt:nth-last-of-type(1),.terms dd:last-child{border-bottom:0}
.form{display:grid;gap:14px;margin-top:16px}
.f-row{display:grid;gap:6px}
.f-label{font-weight:600;font-size:15px}
.req{color:var(--warn);font-weight:600;font-size:13px}
@media (max-width:560px){.terms{grid-template-columns:1fr}.terms dt{border-bottom:0;padding-bottom:2px}}
.intro-box{background:var(--mist);border-left:5px solid var(--yellow);border-radius:10px;padding:12px 14px;margin:6px 0 14px;font-size:15px;color:var(--ink)}
.scale.lm .sc.wide{flex:1 0 84px}
.part h3{font-size:17px;margin:0 0 2px;font-weight:600}
.msg{margin:16px 0 0;color:var(--warn);font-weight:600;font-size:15px;min-height:1.4em}

/* 표 문항 */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;background:var(--mist);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--ink-2);margin-top:16px}
.legend b{color:var(--navy);font-weight:700;margin-right:4px}
.rows{margin-top:6px}
.row{padding:16px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-label{font-weight:600;margin-bottom:10px}
.row-sub{font-size:14px;color:var(--ink-2);margin:10px 0 6px}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.sc{flex:1 0 44px;min-width:44px;height:44px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-weight:600}
.sc.wide{flex:2 0 108px;font-weight:500;font-size:15px;height:auto;min-height:44px;padding:6px 8px;line-height:1.3}
.sc:hover{background:var(--mist)}
.sc[aria-checked="true"]{background:var(--navy);border-color:var(--navy);color:var(--yellow)}
.levels{margin:14px 0 0;padding:0;list-style:none;font-size:15px;color:var(--ink-2)}
.levels li{padding:3px 0}
.levels b{color:var(--navy);display:inline-block;min-width:1.6em}
.num-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.hire{display:grid;grid-template-columns:1fr;gap:8px}
.hire-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:15px}
.chip:hover{background:var(--mist)}
.chip[aria-checked="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* 아래 이동 버튼 */
.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--navy) 72%,rgba(20,33,61,0));padding:26px 0 18px}
.nav .wrap{display:flex;justify-content:space-between;gap:12px}
.btn{border:0;border-radius:14px;padding:14px 26px;font-size:18px;font-weight:700;min-width:120px}
.btn-back{background:transparent;color:#fff;border:1.5px solid var(--on-navy-2)}
.btn-back:hover{border-color:#fff}
.btn-next{background:var(--yellow);color:var(--navy);margin-left:auto}
.btn-next:hover{background:#FFD65C}
.btn-next[aria-disabled="true"]{background:var(--navy-3);color:var(--on-navy-2)}
.btn-next.skip{background:transparent;color:var(--yellow);border:1.5px solid var(--yellow)}

/* 끝 화면 */
.end{color:#fff;padding:60px 0 120px}
.end h1{font-size:clamp(28px,6vw,40px);margin:0 0 18px;line-height:1.25}
.end p{color:var(--on-navy);max-width:36em}
.end .btn{margin-top:18px}
.preview{margin-top:26px;border:1.5px dashed var(--on-navy-2);border-radius:14px;padding:16px 18px;color:var(--on-navy);font-size:15px}
.preview button{margin-top:10px;background:none;border:1.5px solid var(--yellow);color:var(--yellow);border-radius:10px;padding:8px 14px;font-weight:600}

.enter{animation:in .2s ease both}
.enter.back{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}.seg i{transition:none}}
@media (max-width:560px){
  body{font-size:16px}
  .wrap{padding:0 16px}
  .card{padding:30px 18px 22px;border-radius:18px}
  .opts.cols{grid-template-columns:1fr}
  .seg-names{display:none}
  .btn{padding:13px 20px;min-width:104px}
}
</style>
</head>

function answered(q){
  const v = A[q.id];
  switch(q.type){
    case "single": return !!v && v.v!=null && val(q.options,A).some(o=>o.v===v.v);
    case "parts": return q.parts.filter(p=>!p.show||p.show(A)).every(p=>v && v[p.k]!=null);
    case "matrix": return q.rows.every((_,i)=>v && v[i]!=null);
    case "multi": return !!v && v.sel && v.sel.length>0;
    case "numalt": return !!v && (v.alt!=null || (v.n!=="" && v.n!=null));
    case "hire": return !!v && Object.values(v.rows||{}).some(r=>r && ((r.n!==""&&r.n!=null)||r.und));
    case "pair": return q.rows.every((_,i)=>q.cols.every(c=>v && v[c[0]] && v[c[0]][i]!=null));
    case "lmatrix": return q.rows.every((_,i)=>v && v[i]!=null);

    case "text": return !!v && !!String(v.text||"").trim();
    case "form": return !!v && q.fields.filter(f=>f.req).every(f=>String(v[f.k]||"").trim());

    el("button",{type:"button",class:"btn-start",onclick:()=>{ A={}; sid=null; start(); },text:"설문 시작"}),

  );

}
function start(){ cur = route()[0].id; dir=1; renderQ(); }

function optButton(o, checked, square, onpick){

    el("span",{class:"mk","aria-hidden":"true"}), el("span",{}, o.l, o.s?el("small",{text:o.s}):null));
}
function setMsg(t){ const m=$("#msg"); if(m) m.textContent=t||""; }

function renderQ(){
  view="q"; const q = Q.find(x=>x.id===cur); const r=route();
  const card = el("section",{class:"card"});

  if(q.type==="multi") card.append(el("div",{class:"pick",text:q.max?`최대 ${q.max}개 선택`:"해당하는 것 모두 선택"}));
  if(q.intro) card.append(el("p",{class:"intro-box",text:q.intro}));
  if(q.terms) card.append(el("dl",{class:"terms"}, q.terms.map(t=>[el("dt",{text:t[0]}), el("dd",{text:t[1]})]).flat()));

function refreshNav(){
  const q = Q.find(x=>x.id===cur), r=route(), idx=r.findIndex(x=>x.id===cur), last = idx===r.length-1;
  const b=$("#btnNext"), ok=answered(q), must=mustAnswer(q);

  b.textContent = last ? "응답 제출" : (empty && !must ? "건너뛰기" : "다음");
  b.setAttribute("aria-disabled", String(!ok && must));
  $("#btnBack").textContent = idx===0 ? "처음으로" : "이전";
}
function changed(){ setMsg(""); refreshNav(); drawProgress(); save(); }

const BUILD = {

      rows.append(el("div",{class:"row"}, head, extra, el("div",{class:"hire"}, ctl, car)));

  pair(q, body){
    body.append(el("ul",{class:"levels"}, q.levels.map(l=>el("li",{}, el("b",{text:l[0]}), l[1]))));
    const rows = el("div",{class:"rows"}); body.append(rows);
    q.rows.forEach((label,i)=>{
      const row = el("div",{class:"row"}, el("div",{class:"row-label",text:label}));
      q.cols.forEach(c=>{ const sc = el("div",{class:"scale",role:"radiogroup","aria-label":`${label} — ${c[1]}`});
        const pick = x => { const col=Object.assign({},(A[q.id]||{})[c[0]]); col[i]=x; A[q.id]=Object.assign({},A[q.id],{[c[0]]:col}); draw(); changed(); };
        const draw = () => { sc.replaceChildren(); const v=((A[q.id]||{})[c[0]]||{})[i];
          [0,1,2,3,4].forEach(n=>sc.append(el("button",{type:"button",class:"sc",role:"radio","aria-checked":String(v===n),text:String(n),onclick:()=>pick(n)})));
          sc.append(el("button",{type:"button",class:"sc wide",role:"radio","aria-checked":String(v==="X"),text:q.alt,onclick:()=>pick("X")})); };

      const inp = el("input",{type:"number",min:"0",max:"9999",step:"1",inputmode:"numeric","aria-label":r.l+" 예상 인원",oninput:e=>{ const t=e.target.value.replace(/[^0-9]/g,""); A[q.id]=Object.assign({},A[q.id],{[r.k]:{n:t===""?"":Number(t),alt:null}}); draw(); changed(); }});
      const chips = el("span",{class:"hire-ctl",role:"radiogroup","aria-label":r.l+" 숫자 대신 선택"});
      const draw = () => { chips.replaceChildren(); const v=(A[q.id]||{})[r.k]||{};
        q.alts.forEach(o=>chips.append(el("button",{type:"button",class:"chip",role:"radio","aria-checked":String(v.alt===o.v),text:o.l,onclick:()=>{ A[q.id]=Object.assign({},A[q.id],{[r.k]:{n:"",alt:o.v}}); inp.value=""; draw(); changed(); }}))); };
      const v=(A[q.id]||{})[r.k]||{}; if(v.n!==""&&v.n!=null) inp.value=v.n; draw();

/* ===== 이동 ===== */
function next(){
  const q = Q.find(x=>x.id===cur);
  if(!answered(q) && mustAnswer(q)){ setMsg(q.type==="form" ? "필수 항목(기업명·성명·연락처)을 적어 주세요. 적고 싶지 않으면 이전 화면에서 ‘동의하지 않음’을 고르면 됩니다." : q.type==="matrix"||q.type==="pair"||q.type==="lmatrix" ? "모든 줄에서 하나씩 골라 주세요." : "이 문항은 다음 문항을 정하는 데 필요합니다. 하나를 골라 주세요."); return; }
  if(q.id==="A2" && A.A2 && A.A2.v===2){ dir=1; renderOut(); return; }
  const r = route(), idx = r.findIndex(x=>x.id===cur);
  if(idx===r.length-1){ submit(); return; }
  cur = r[idx+1].id; dir=1; renderQ();
}
function back(){
  const r = route(), idx = r.findIndex(x=>x.id===cur);
  dir=-1; if(idx<=0){ save(); renderIntro(); return; }
  cur = r[idx-1].id; renderQ();
}
function renderOut(){
  view="out"; save();
  show(el("section",{class:"end"},
    el("h1",{text:"이번 조사는 인천 소재 사업장을 대상으로 합니다"}), el("div",{class:"rule"}),
    el("p",{text:"소속 사업장이 인천광역시 밖에 있어 여기서 조사를 마칩니다. 참여해 주셔서 감사합니다."}),
    el("p",{text:"소재지를 잘못 고르셨다면 이전 문항으로 돌아가 고칠 수 있습니다."}),
    el("button",{type:"button",class:"btn btn-back",onclick:()=>{ dir=-1; cur="A2"; renderQ(); },text:"이전 문항으로"})),{});
}

/* ===== 제출 ===== */
function payload(){
  const r = route(), ans = {};
  r.forEach(q=>{ if(A[q.id]==null) return; let v=JSON.parse(JSON.stringify(A[q.id]));
    if(q.type==="parts") q.parts.forEach(p=>{ if(p.show && !p.show(A)) delete v[p.k]; });      // 경로에 없는 세부 항목 제거
    if(q.type==="nrows") q.rows.forEach(x=>{ if(x.show && !x.show(A)) delete v[x.k]; });
    if(q.type==="single" && !val(q.options,A).some(o=>o.v===v.v)) return;
    ans[q.id]=v; });
  if(!sid) sid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2));
  return {surveyVersion:VERSION, submissionId:sid, submittedAt:new Date().toISOString(), respondentType: isCo(A)?"기업 대표응답자":"일반 재직자", route:r.map(q=>q.id), answers:ans};
}
async function submit(){
  if(sending) return; const data = payload();
  if(!CONFIG.submitUrl){ renderDone(data, true); return; }
  sending=true; const b=$("#btnNext"); b.textContent="제출하는 중"; b.setAttribute("aria-disabled","true");
  try{
    const res = await fetch(CONFIG.submitUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});
    if(!res.ok) throw new Error(String(res.status));
    renderDone(data,false);
  }catch(e){ setMsg("응답을 보내지 못했습니다. 인터넷 연결을 확인한 뒤 ‘응답 제출’을 다시 눌러 주세요. 작성한 내용은 그대로 남아 있습니다."); refreshNav(); }
  finally{ sending=false; }
}
function renderDone(data, preview){
  view="done"; try{ sessionStorage.removeItem(KEY); }catch(e){}
  const n = el("section",{class:"end"}, el("h1",{text:"응답해 주셔서 감사합니다"}), el("div",{class:"rule"}),
    el("p",{text:"보내 주신 응답은 인천 지역의 디지털신기술 교육과정과 기업협력 프로그램을 설계하는 데 활용합니다."}));
  if(preview){ n.append(el("div",{class:"preview"}, "미리보기 상태입니다. 응답을 받을 주소가 설정되지 않아 이 응답은 저장되지 않았습니다.",
    el("br"), el("button",{type:"button",onclick:()=>{ const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); const a=el("a",{href:URL.createObjectURL(blob),download:"응답_미리보기.json"}); document.body.append(a); a.click(); a.remove(); },text:"이 응답을 파일로 내려받기"}))); }
  dir=1; show(n,{}); window.__lastPayload = data;
}

$("#btnNext").addEventListener("click", next);
$("#btnBack").addEventListener("click", back);
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && view==="q" && !e.isComposing && e.target.tagName!=="TEXTAREA" && e.target.tagName!=="BUTTON"){ e.preventDefault(); next(); } });
renderIntro();
